[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentaxiom"
version = "0.1.0"
description = "Evidence-first regression and contract testing for Gemini and Vertex AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AgentAxiom"}]
keywords = ["ai", "agents", "gemini", "vertex-ai", "testing", "regression-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["jsonschema>=4.23"]

[project.urls]
Homepage = "https://github.com/Hardonian/AgentAxiom"
Repository = "https://github.com/Hardonian/AgentAxiom"
Issues = "https://github.com/Hardonian/AgentAxiom/issues"
Changelog = "https://github.com/Hardonian/AgentAxiom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
vertex = ["google-genai>=1.0"]
export = ["google-cloud-bigquery>=3.0", "google-cloud-storage>=2.0"]
all = ["google-genai>=1.0", "google-cloud-bigquery>=3.0", "google-cloud-storage>=2.0"]
test = ["pytest>=8.0"]
lint = ["ruff>=0.8"]

[project.entry-points.pytest11]
agentaxiom = "agentaxiom.pytest_plugin"

[project.scripts]
agentaxiom = "agentaxiom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentaxiom"]
include = [
  "src/agentaxiom/ui/*.html",
  "src/agentaxiom/schemas/*.json",
  "src/agentaxiom/catalogs/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["agentaxiom"]
