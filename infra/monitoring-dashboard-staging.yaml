displayName: AgentAxiom staging operational dashboard
gridLayout:
  widgets:
    - title: AgentAxiom staging evaluator
      text:
        format: MARKDOWN
        content: |
          ## AgentAxiom staging

          - Service: `agentaxiom-evaluator` (`us-central1`)
          - Evidence bucket: `agentaxiom-evidence-stg-20261020`
          - BigQuery table: `agentaxiom.runs`
          - This project is isolated from production and intended for load, failure, rollback, export, and trace exercises.

          Alert delivery remains disabled until a named on-call owner and approved notification channel are supplied.
    - title: Cloud Run request rate
      xyChart:
        dataSets:
          - timeSeriesQuery:
              timeSeriesFilter:
                filter: 'metric.type="run.googleapis.com/request_count" resource.type="cloud_run_revision" resource.label."service_name"="agentaxiom-evaluator"'
                aggregation:
                  alignmentPeriod: 60s
                  perSeriesAligner: ALIGN_RATE
                  crossSeriesReducer: REDUCE_SUM
        yAxis:
          label: requests / second
          scale: LINEAR
    - title: Cloud Run 5xx rate
      xyChart:
        dataSets:
          - timeSeriesQuery:
              timeSeriesFilter:
                filter: 'metric.type="run.googleapis.com/request_count" resource.type="cloud_run_revision" resource.label."service_name"="agentaxiom-evaluator" metric.label."response_code_class"="5xx"'
                aggregation:
                  alignmentPeriod: 60s
                  perSeriesAligner: ALIGN_RATE
                  crossSeriesReducer: REDUCE_SUM
        yAxis:
          label: errors / second
          scale: LINEAR
