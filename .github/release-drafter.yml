name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-resolver:
  major: {labels: ["breaking"]}
  minor: {labels: ["feature"]}
  patch: {labels: ["fix", "security"]}
  default: patch
categories:
  - title: "Breaking changes"
    labels: ["breaking"]
  - title: "Features"
    labels: ["feature"]
  - title: "Fixes"
    labels: ["fix", "security"]
change-template: "- $TITLE (#$NUMBER)"
template: |
  ## Changes
  $CHANGES
