name: AgentAxiom contracts
on: [push, pull_request]
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: agentaxiom-evidence, path: agentaxiom-evidence, if-no-files-found: ignore}
