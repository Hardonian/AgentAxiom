name: Deploy staging evaluator
on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable image digest to deploy.
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  plan:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra
        run: |
          terraform init
          terraform plan -input=false -var project_id='${{ vars.GCP_PROJECT_ID }}' -var image='${{ inputs.image }}' -var evidence_bucket_name='${{ vars.AGENTAXIOM_EVIDENCE_BUCKET }}'
