name: Draft release notes
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
