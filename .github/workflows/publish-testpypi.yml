name: Publish to TestPyPI
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agentaxiom/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install build twine pip-audit
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip-audit
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Verify clean TestPyPI installation
        run: |
          sleep 10
          python -m venv test-env
          ./test-env/bin/python -m pip install --upgrade pip
          ./test-env/bin/python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple agentaxiom
          ./test-env/bin/agentaxiom --help
          ./test-env/bin/agentaxiom check examples/fixture.json examples/contract.json
