# Google Cloud Build pipeline for AgentAxiom contract testing and container deployment
# Runs linting, deterministic tests, contract gates, wheel build, and container build.

steps:
  # 1. Prepare environment and dependencies
  - name: 'python:3.12-slim'
    id: 'install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python -m pip install --upgrade pip
        pip install -e '.[test,lint]'

  # 2. Quality and lint check
  - name: 'python:3.12-slim'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install ruff
        ruff check .

  # 3. Deterministic offline regression tests
  - name: 'python:3.12-slim'
    id: 'test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -e '.[test]'
        pytest -v --agentaxiom-evidence=agentaxiom-evidence

  # 4. Check deployment contract against fixture
  - name: 'python:3.12-slim'
    id: 'contract-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -e .
        agentaxiom check examples/fixture.json examples/contract.json --evidence-dir=agentaxiom-evidence

  # 5. Build Python distribution and verify metadata
  - name: 'python:3.12-slim'
    id: 'package-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install build twine
        python -m build
        python -m twine check dist/*

  # 6. Build container image for Cloud Run Evaluator
  - name: 'gcr.io/cloud-builders/docker'
    id: 'container-build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agentaxiom/evaluator:${BUILD_ID}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agentaxiom/evaluator:latest'
      - '.'

# Upload sanitized evidence bundles and wheel distributions as build artifacts
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-agentaxiom-builds/${BUILD_ID}'
    paths:
      - 'agentaxiom-evidence/**'
      - 'dist/**'

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agentaxiom/evaluator:${BUILD_ID}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/agentaxiom/evaluator:latest'

options:
  logging: CLOUD_LOGGING_ONLY
