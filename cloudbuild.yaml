# Google Cloud Build pipeline for AgentAxiom contract testing
# Runs offline-first regression verification and publishes evidence to Google Cloud Storage.

steps:
  # 1. Prepare environment and dependencies
  - name: 'python:3.12-slim'
    id: 'install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python -m pip install --upgrade pip
        pip install -e '.[test,lint]'

  # 2. Quality and lint check
  - name: 'python:3.12-slim'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install ruff
        ruff check .

  # 3. Deterministic offline regression tests
  - name: 'python:3.12-slim'
    id: 'test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -e '.[test]'
        pytest -v --agentaxiom-evidence=agentaxiom-evidence

  # 4. Check deployment contract against fixture
  - name: 'python:3.12-slim'
    id: 'contract-check'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -e .
        agentaxiom check examples/fixture.json examples/contract.json --evidence-dir=agentaxiom-evidence

# Upload sanitized evidence bundles as build artifacts
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-agentaxiom-builds/${BUILD_ID}'
    paths: ['agentaxiom-evidence/**']

options:
  logging: CLOUD_LOGGING_ONLY
